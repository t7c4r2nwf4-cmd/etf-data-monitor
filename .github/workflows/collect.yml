name: ETF market snapshot
on:
  workflow_dispatch:
  push:
    paths:
      - 'src/**'
      - 'tests/**'
      - '.github/workflows/collect.yml'
      - 'requirements.txt'
  schedule:
    # Beijing time = UTC+8; GitHub schedule may be delayed.
    - cron: '35,45 0 * * 1-5'       # 08:35 / 08:45
    - cron: '35,45 5 * * 1-5'       # 13:35 / 13:45
    - cron: '15,25,45 6 * * 1-5'    # 14:15 / 14:25 / 14:45
    - cron: '15 7 * * 1-5'          # 15:15
    - cron: '15 8 * * 1-5'          # 16:15
permissions:
  contents: write
concurrency:
  group: market-snapshot-main
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q tests/
      - run: python src/main.py
        env:
          TZ: Asia/Shanghai
      - name: Commit only public machine outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs data
          if ! git diff --cached --quiet; then
            git commit -m "data: update ETF and SPX public snapshots"
            git push
          fi
